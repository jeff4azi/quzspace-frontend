<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuzSpace - AI-Powered Study Space Platform</title>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="QuzSpace is an AI-powered study platform that turns lecture notes, PDFs, and study materials into interactive summaries, 3D flashcards, practice quizzes, and 24/7 AI chat tutoring."
    />
    <meta
      name="keywords"
      content="QuzSpace, AI study app, flashcards, quiz generator, AI tutor, study space, lecture notes to quiz, PDF summary, exam prep"
    />
    <meta name="author" content="QuzSpace Inc." />

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#242021" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QuzSpace" />
    <meta name="application-name" content="QuzSpace" />

    <!-- Favicons & Touch Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Social Media Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="QuzSpace - AI-Powered Study Space Platform" />
    <meta
      property="og:description"
      content="Turn lecture notes, PDFs, and study materials into interactive AI summaries, 3D flashcards, quizzes, and 24/7 chat tutoring."
    />
    <meta property="og:image" content="/Quzspace_logo.png" />
    <meta property="og:site_name" content="QuzSpace" />

    <!-- Twitter Card Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QuzSpace - AI-Powered Study Space Platform" />
    <meta
      name="twitter:description"
      content="Turn lecture notes, PDFs, and study materials into interactive AI summaries, 3D flashcards, quizzes, and 24/7 chat tutoring."
    />
    <meta name="twitter:image" content="/Quzspace_logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
